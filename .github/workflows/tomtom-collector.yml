
name: TomTom EV Availability Collection

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_reason:
        description: "Reason for manual collection"
        required: false
        default: "Manual test"

permissions:
  contents: write

concurrency:
  group: tomtom-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas "psycopg[binary]"

      - name: Collect TomTom availability
        run: python src/tomtom_collector.py
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}

      - name: Clean availability observations
        run: python src/data_cleaner.py

      - name: Import observations into Supabase
        run: python src/database_import.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Save collected data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/availability_observations_v2.csv
          git add -f data/cleaned_availability_observations_v2.csv
          git diff --cached --quiet || git commit -m "Update EV charging availability observations"
          git push
